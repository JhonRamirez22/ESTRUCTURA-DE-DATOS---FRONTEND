name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      PYTHON_API_URL: http://127.0.0.1:8000
      CSP_MODE: enforce
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Pruebas unitarias
        run: pnpm test
      - name: Compilación
        run: pnpm build
